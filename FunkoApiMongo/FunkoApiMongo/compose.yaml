services:
  # Base de datos MongoDB
  mongo_db:
    image: mongo:latest
    container_name: funko_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # Persistencia de datos
    networks:
      - funko_net
  redis:
    image: redis:latest
    container_name: funko_redis
    ports:
      - "6379:6379"
    networks:
      - funko_net

  # Tu API en .NET
  funko_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funko_api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__MongoDb=mongodb://mongo_db:27017
    depends_on:
      - mongo_db
    networks:
      - funko_net

networks:
  funko_net:
    driver: bridge

volumes:
  mongo_data: